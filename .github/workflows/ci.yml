name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes Python e PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: locadora_test
          POSTGRES_USER: locadora_app
          POSTGRES_PASSWORD: senha-temporaria-exclusiva-do-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U locadora_app -d locadora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONUTF8: "1"
      LOCADORA_ADMIN_USUARIO: admin_ci
      LOCADORA_ADMIN_SENHA: senha-temporaria-do-admin-ci
      LOCADORA_JWT_SECRET: chave-jwt-temporaria-exclusiva-do-ci-1234567890
      LOCADORA_DATABASE_URL: sqlite:///dados/locadora_ci.db
      LOCADORA_TEST_DATABASE_URL: postgresql+psycopg://locadora_app:senha-temporaria-exclusiva-do-ci@localhost:5432/locadora_test

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Verificar qualidade do código
        run: python -m ruff check .

      - name: Auditar dependências
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Preparar diretório de dados
        run: mkdir -p dados

      - name: Validar migrations no PostgreSQL
        env:
          LOCADORA_DATABASE_URL: ${{ env.LOCADORA_TEST_DATABASE_URL }}
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Executar testes
        run: python -m pytest

  docker:
    name: Construção da imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Validar Docker Compose
        run: docker compose --env-file .env.docker.example config --quiet

      - name: Construir imagem da API
        run: docker build --tag locadora-api:ci .
