services:
  - type: web
    name: locadora-fastapi
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: LOCADORA_ADMIN_USUARIO
        value: admin

      - key: LOCADORA_ADMIN_SENHA
        sync: false

      - key: LOCADORA_JWT_SECRET
        generateValue: true

      - key: LOCADORA_DATABASE_URL
        sync: false

      - key: LOCADORA_BREVO_API_KEY
        sync: false

      - key: LOCADORA_EMAIL_REMETENTE
        sync: false

      - key: LOCADORA_PUBLIC_URL
        value: https://locadora-fastapi.onrender.com

      - key: LOCADORA_AMBIENTE
        value: production

      - key: LOCADORA_REDIS_URL
        sync: false

      - key: LOCADORA_REDIS_PREFIXO
        value: locadora:production

      - key: LOCADORA_REDIS_TIMEOUT_MS
        value: "500"

      - key: LOCADORA_CACHE_DASHBOARD_TTL_SEGUNDOS
        value: "30"

      - key: LOCADORA_BACKGROUND_JOBS_ENABLED
        value: "true"

      - key: LOCADORA_BACKGROUND_JOBS_INTERVALO_SEGUNDOS
        value: "60"

      - key: LOCADORA_BACKGROUND_JOBS_LOTE
        value: "50"

      - key: LOCADORA_BACKGROUND_JOBS_TIMEOUT_BLOQUEIO_SEGUNDOS
        value: "900"

      - key: LOCADORA_MENSAGERIA_ENABLED
        value: "true"

      - key: LOCADORA_MENSAGERIA_INTERVALO_SEGUNDOS
        value: "5"

      - key: LOCADORA_MENSAGERIA_LOTE
        value: "100"

      - key: LOCADORA_MENSAGERIA_TIMEOUT_BLOQUEIO_SEGUNDOS
        value: "60"

      - key: LOCADORA_MENSAGERIA_RETRY_BASE_SEGUNDOS
        value: "5"

      - key: LOCADORA_MENSAGERIA_RETRY_MAX_SEGUNDOS
        value: "300"
