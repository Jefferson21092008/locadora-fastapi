services:
  - type: web
    name: locadora-fastapi
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: LOCADORA_DATABASE_URL
        sync: false
      - key: LOCADORA_ADMIN_USUARIO
        value: admin
      - key: LOCADORA_ADMIN_SENHA
        sync: false
      - key: LOCADORA_JWT_SECRET
        generateValue: true
