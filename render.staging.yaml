services:
  - type: web
    name: locadora-fastapi-staging
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: LOCADORA_AMBIENTE
        value: staging

      - key: LOCADORA_ADMIN_USUARIO
        value: admin_staging

      - key: LOCADORA_ADMIN_SENHA
        sync: false

      - key: LOCADORA_JWT_SECRET
        generateValue: true

      - key: LOCADORA_DATABASE_URL
        sync: false

      - key: LOCADORA_PUBLIC_URL
        value: https://locadora-fastapi-staging.onrender.com

      - key: LOCADORA_SENTRY_DSN
        sync: false

      - key: LOCADORA_REDIS_URL
        sync: false

      - key: LOCADORA_REDIS_PREFIXO
        value: locadora:staging

      - key: LOCADORA_REDIS_TIMEOUT_MS
        value: "500"

      - key: LOCADORA_CACHE_DASHBOARD_TTL_SEGUNDOS
        value: "30"

      # Evita disparar lembretes/e-mails automáticos durante homologação.
      - key: LOCADORA_BACKGROUND_JOBS_ENABLED
        value: "false"
