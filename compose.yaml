name: locadora

x-locadora-environment: &locadora-environment
  LOCADORA_ADMIN_USUARIO: ${LOCADORA_ADMIN_USUARIO:-admin}
  LOCADORA_ADMIN_SENHA: ${LOCADORA_ADMIN_SENHA:?Defina LOCADORA_ADMIN_SENHA no arquivo .env.docker}
  LOCADORA_JWT_SECRET: ${LOCADORA_JWT_SECRET:?Defina LOCADORA_JWT_SECRET no arquivo .env.docker}
  LOCADORA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-locadora_app}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env.docker}@db:5432/${POSTGRES_DB:-locadora}
  LOCADORA_AMBIENTE: ${LOCADORA_AMBIENTE:-development}
  LOCADORA_PUBLIC_URL: ${LOCADORA_PUBLIC_URL:-http://127.0.0.1:8000}
  LOCADORA_SENTRY_DSN: ${LOCADORA_SENTRY_DSN:-}
  LOCADORA_REDIS_URL: ${LOCADORA_REDIS_URL:-redis://cache:6379/0}
  LOCADORA_REDIS_PREFIXO: ${LOCADORA_REDIS_PREFIXO:-locadora:development}
  LOCADORA_REDIS_TIMEOUT_MS: ${LOCADORA_REDIS_TIMEOUT_MS:-500}
  LOCADORA_CACHE_DASHBOARD_TTL_SEGUNDOS: ${LOCADORA_CACHE_DASHBOARD_TTL_SEGUNDOS:-30}
  LOCADORA_BACKGROUND_JOBS_ENABLED: ${LOCADORA_BACKGROUND_JOBS_ENABLED:-true}
  LOCADORA_BACKGROUND_JOBS_INTERVALO_SEGUNDOS: ${LOCADORA_BACKGROUND_JOBS_INTERVALO_SEGUNDOS:-60}
  LOCADORA_BACKGROUND_JOBS_LOTE: ${LOCADORA_BACKGROUND_JOBS_LOTE:-50}
  LOCADORA_BACKGROUND_JOBS_TIMEOUT_BLOQUEIO_SEGUNDOS: ${LOCADORA_BACKGROUND_JOBS_TIMEOUT_BLOQUEIO_SEGUNDOS:-900}
  LOCADORA_MENSAGERIA_ENABLED: ${LOCADORA_MENSAGERIA_ENABLED:-true}
  LOCADORA_MENSAGERIA_INTERVALO_SEGUNDOS: ${LOCADORA_MENSAGERIA_INTERVALO_SEGUNDOS:-5}
  LOCADORA_MENSAGERIA_LOTE: ${LOCADORA_MENSAGERIA_LOTE:-100}
  LOCADORA_MENSAGERIA_TIMEOUT_BLOQUEIO_SEGUNDOS: ${LOCADORA_MENSAGERIA_TIMEOUT_BLOQUEIO_SEGUNDOS:-60}
  LOCADORA_MENSAGERIA_RETRY_BASE_SEGUNDOS: ${LOCADORA_MENSAGERIA_RETRY_BASE_SEGUNDOS:-5}
  LOCADORA_MENSAGERIA_RETRY_MAX_SEGUNDOS: ${LOCADORA_MENSAGERIA_RETRY_MAX_SEGUNDOS:-300}
  LOCADORA_ESCALA_HORIZONTAL_ENABLED: ${LOCADORA_ESCALA_HORIZONTAL_ENABLED:-true}
  LOCADORA_WORKERS_EMBUTIDOS: ${LOCADORA_WORKERS_EMBUTIDOS:-false}
  LOCADORA_CONTAINER_APLICAR_MIGRATIONS: ${LOCADORA_CONTAINER_APLICAR_MIGRATIONS:-false}
  LOCADORA_DB_POOL_SIZE: ${LOCADORA_DB_POOL_SIZE:-3}
  LOCADORA_DB_MAX_OVERFLOW: ${LOCADORA_DB_MAX_OVERFLOW:-2}
  LOCADORA_DB_POOL_TIMEOUT_SEGUNDOS: ${LOCADORA_DB_POOL_TIMEOUT_SEGUNDOS:-15}
  LOCADORA_EXECUTAR_MIGRATIONS: "false"
  PORT: "8000"

x-locadora-runtime: &locadora-runtime
  image: locadora-api:local
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true
  restart: unless-stopped

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-locadora}
      POSTGRES_USER: ${POSTGRES_USER:-locadora_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env.docker}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - locadora_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  cache:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: locadora-api:local
    build:
      context: .
    environment: *locadora-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: "no"

  api:
    <<: *locadora-runtime
    build:
      context: .
    environment: *locadora-environment
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    pids_limit: 256

  background-worker:
    <<: *locadora-runtime
    environment: *locadora-environment
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "modulos.background_worker"]
    healthcheck:
      disable: true
    pids_limit: 128

  outbox-worker:
    <<: *locadora-runtime
    environment: *locadora-environment
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "modulos.outbox_worker"]
    healthcheck:
      disable: true
    pids_limit: 128

  gateway:
    image: nginx:1.28-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8080"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  locadora_postgres_data:
